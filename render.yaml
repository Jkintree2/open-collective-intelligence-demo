# Render blueprint: one free web service running the demo.
# Secrets are typed into the Render dashboard (sync: false) or generated by Render (generateValue: true).
services:
  - type: web
    name: open-collective-intelligence-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        sync: false
      - key: DEMO_PASSPHRASE
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: SITE_NAME
        value: Open Collective Intelligence
      - key: SITE_SENTENCE
        value: Write what you think about an issue that matters to you. We will pull out the issue, your claim, any evidence and any solution, show you what we found, and add it to a record everyone here shares.
      - key: APP_ENV
        value: production
      # Reading service. The key is typed into the dashboard; without it the card is filled by hand.
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.deepseek.com
      - key: LLM_MODEL
        value: deepseek-v4-flash
