<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My account · Open Collective Intelligence</title>
  <link rel="stylesheet" href="/static/app.css?v=ASSET">
  <script src="/static/once.js?v=ASSET" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="site-name" href="/">Open Collective Intelligence</a>
    <nav><a href="/">Write</a><a href="/issues">Issues</a><a href="/people">Enter a person</a><a href="/my-statements">My statements</a><a href="/account">My account</a></nav>
  </header>
  <main class="column">
    
<h1>My account</h1>
<form method="post" action="/sign-out" class="sign-out"><button type="submit" class="quiet">Sign out</button></form>

<p>Ada Tester · ada@example.org</p>

<h2>My details</h2>

<form method="post" action="/account/details" class="account-details stacked-form" data-once>
  <label for="name">Name:</label>
  <input id="name" name="name" type="text" maxlength="120" autocomplete="name" required value="Ada Tester">
  <label for="country">Country:</label>
  <input id="country" name="country" type="text" maxlength="80" autocomplete="country-name" required value="">
  <label for="postal_code">Postal code (optional):</label>
  <input id="postal_code" name="postal_code" type="text" maxlength="20" autocomplete="postal-code" value="">
  <p class="counts">Posts you have already made keep the name they were posted with.</p>
  <button type="submit" class="primary">Save my details</button>
</form>
<h2>Change my password</h2>

<form method="post" action="/account/password" class="stacked-form">
  <label for="username">Email:</label>
  <input id="username" name="username" type="email" value="ada@example.org" autocomplete="username" class="read-only" tabindex="-1" readonly>
  <label for="current">Current password:</label>
  <input id="current" name="current" type="password" autocomplete="current-password" required>
  <label for="password">New password:</label>
  <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required>
  <label for="again">Type it again:</label>
  <input id="again" name="again" type="password" autocomplete="new-password" minlength="10" required>
  <button type="submit" class="primary">Change password</button>
</form>


  </main>
</body>
</html>
