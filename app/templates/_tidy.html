{% if tidy %}
<section class="tidy">
  <h2>Tidy this issue</h2>
  {% if tidy.notice %}<p class="notice" role="status">{{ tidy.notice }}</p>{% endif %}
  {% if tidy.problem %}<p class="notice" role="alert">{{ tidy.problem }}</p>{% endif %}
  <form method="post" action="/issues/{{ issue.key|urlencode }}/rename">
    <label for="new_name">New name:</label>
    <input id="new_name" name="new_name" type="text" maxlength="300" required value="{{ issue.name }}">
    <button type="submit">Rename</button>
  </form>
  {% if tidy.has_children %}
  <p class="counts">Other issues are part of this one, so it stays at the top level.</p>
  {% else %}
  <form method="post" action="/issues/{{ issue.key|urlencode }}/move">
    <label for="parent">Make it part of:</label>
    <select id="parent" name="parent">
      <option value="">none, make it a top level issue</option>
      {% for option in tidy.parents %}<option value="{{ option.key }}"{% if option.key == issue.parent_key %} selected{% endif %}>{{ option.name }}</option>{% endfor %}
    </select>
    <button type="submit">Move</button>
  </form>
  {% endif %}
  <form method="get" action="/issues/{{ issue.key|urlencode }}/merge">
    <label for="other">Merge another issue into this one:</label>
    <select id="other" name="other" required>
      <option value="">Choose an issue</option>
      {% for option in tidy.others %}<option value="{{ option.key }}">{{ option.name }}</option>{% endfor %}
    </select>
    <button type="submit">Merge</button>
  </form>
</section>
{% endif %}
