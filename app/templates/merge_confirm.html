{% extends "base.html" %}
{% block title %}Merge · {{ site_name }}{% endblock %}
{% block content %}
<p>Keep {{ kept.name }}. Move everything from {{ merged.name }} into it, then remove {{ merged.name }}. This cannot be undone. It is recorded in the list of changes.</p>
<div class="row-actions">
  <form method="post" action="/issues/{{ kept.key|urlencode }}/merge">
    <input type="hidden" name="other" value="{{ merged.key }}">
    <button type="submit" class="primary">Merge</button>
  </form>
  <a class="quiet" href="/issues/{{ kept.key|urlencode }}">Cancel</a>
</div>
{% endblock %}
