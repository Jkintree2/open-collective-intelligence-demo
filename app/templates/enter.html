{% extends "base.html" %}
{% block nav %}{% endblock %}
{% block content %}
<section class="card gate">
  <h1>{{ site_name }}</h1>
  <p>A closed test of a shared record of what people are claiming, proposing and citing.</p>
  {% include "_record_notice.html" %}
  {% if message %}<p class="notice" role="alert">{{ message }}</p>{% endif %}
  <form method="post" action="/enter">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="passphrase">Passphrase:</label>
    <input id="passphrase" name="passphrase" type="password" autocomplete="off" required autofocus>
    <button type="submit" class="primary">Enter</button>
  </form>
</section>
{% endblock %}
